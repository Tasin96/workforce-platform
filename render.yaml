services:
  - type: web
    name: workforce-platform
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: workforce-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: workforce-db
    plan: free
    databaseName: workforce_platform
    user: workforce_user
